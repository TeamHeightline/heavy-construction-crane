[entity-name]
heavy-tower-crane=Heavy tower construction crane
heavy-tower-crane-power=Tower crane electric drive
[entity-description]
heavy-tower-crane=Builds friendly entity ghosts within 19.5 tiles using its 80-slot inventory. Rotating jib, moving trolley and animated hoist. Uses 24 MW while operating, with no constant idle drain. Foundation: 12×12 tiles. Supply power at the foundation edge and load building items. Open for status and pause controls. Does not clear obstacles or place tiles.
[item-name]
heavy-tower-crane=Heavy tower construction crane
[item-description]
heavy-tower-crane=Stationary construction crane: 19.5-tile range, 80 inventory slots, 24 MW while operating. Large 12×12 foundation. Crafted in assembling machines.
[recipe-name]
heavy-tower-crane=Heavy tower construction crane
[technology-name]
heavy-tower-crane=Tower construction cranes
[technology-description]
heavy-tower-crane=An expensive construction machine for early railway sites. Available after Railway with red and green science. Installs buildings from its inventory using a travelling trolley and hoist.
[recipe-category-name]
heavy-tower-crane-assembly=Tower crane assembly
