[entity-name]
heavy-tower-crane=Тяжёлый башенный строительный кран
heavy-tower-crane-power=Электропривод башенного крана
[entity-description]
heavy-tower-crane=Строит призраки зданий своей фракции в радиусе 19,5 клетки из 80 ячеек. Поворотная стрела, подвижная тележка и подъёмный крюк. Рабочая мощность 24 МВт; ожидание без постоянного расхода. Основание 12×12 клетки. Подведите электричество к краю основания и загрузите предметы. Откройте кран для состояния и паузы. Не расчищает препятствия и не укладывает плитку.
[item-name]
heavy-tower-crane=Тяжёлый башенный строительный кран
[item-description]
heavy-tower-crane=Стационарный строительный кран: радиус 19,5 клетки, 80 ячеек, мощность 24 МВт. Большое основание 12×12 клетки. Изготавливается в сборочном автомате.
[recipe-name]
heavy-tower-crane=Тяжёлый башенный строительный кран
[technology-name]
heavy-tower-crane=Башенные строительные краны
[technology-description]
heavy-tower-crane=Дорогая строительная машина для первых железнодорожных стройплощадок. Доступна после железной дороги за красные и зелёные научные пакеты. Устанавливает здания из собственного инвентаря с помощью тележки и крюка.
[recipe-category-name]
heavy-tower-crane-assembly=Сборка башенного крана
