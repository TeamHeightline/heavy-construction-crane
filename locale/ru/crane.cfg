[entity-description]
heavy-construction-crane=Строит призраки зданий своей фракции в радиусе 16 клеток, используя предметы из 10 ячеек. Поворачивает и выдвигает стрелу к месту строительства. Потребляет 1,8 МВт во время работы; без электричества движение приостанавливается. Радиус виден при наведении. Не расчищает препятствия и не укладывает плитку.

[item-name]
